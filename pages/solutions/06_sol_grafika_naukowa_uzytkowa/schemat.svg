<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="1500" height="450" viewBox="0 0 1500 450">
  <title>Od pytania do wniosku</title>
  <desc>Cztery etapy pracy z danymi połączone strzałkami: Pytanie, Dane, Analiza, Wniosek.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6"
            orient="auto" markerUnits="strokeWidth">
      <path d="M 1,1 L 10,6 L 1,11" fill="none" stroke="#325e78" stroke-width="1.8"/>
    </marker>
  </defs>
  <g inkscape:groupmode="layer" inkscape:label="Tło" id="background">
    <rect x="0" y="0" width="1500" height="450" fill="#f6f8f7"/>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="Połączenia" id="connections"
     fill="none" stroke="#325e78" stroke-width="5" stroke-linecap="round">
    <path d="M 360,205 H 425" marker-end="url(#arrow)"/>
    <path d="M 700,205 H 765" marker-end="url(#arrow)"/>
    <path d="M 1040,205 H 1105" marker-end="url(#arrow)"/>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="Etapy" id="stages"
     font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="80" y="138" width="280" height="135" rx="18" fill="#e1edf2" stroke="#325e78" stroke-width="4"/>
    <rect x="420" y="138" width="280" height="135" rx="18" fill="#e1edf2" stroke="#325e78" stroke-width="4"/>
    <rect x="760" y="138" width="280" height="135" rx="18" fill="#e1edf2" stroke="#325e78" stroke-width="4"/>
    <rect x="1100" y="138" width="280" height="135" rx="18" fill="#d9e8da" stroke="#386b55" stroke-width="4"/>
    <g fill="#173b4e" font-size="39" font-weight="600">
      <text x="220" y="220">Pytanie</text>
      <text x="560" y="220">Dane</text>
      <text x="900" y="220">Analiza</text>
      <text x="1240" y="220">Wniosek</text>
    </g>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="Adnotacja" id="annotation"
     font-family="Arial, sans-serif" text-anchor="middle" fill="#4b5b61">
    <text x="900" y="316" font-size="23">Sprawdź założenia i niepewność</text>
  </g>
</svg>
